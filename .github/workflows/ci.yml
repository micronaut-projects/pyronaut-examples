name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        name: Find examples
        # Every <Example>/java/Main.java and <Example>/python/main.py is a test leg,
        # so new examples are picked up without editing this workflow.
        run: |
          set -euo pipefail
          entries=()
          for main in */java/Main.java */python/main.py; do
            [ -f "$main" ] || continue
            entries+=("{\"example\":\"${main%%/*}\",\"language\":\"$(basename "$(dirname "$main")")\"}")
          done
          matrix=$(IFS=,; echo "{\"include\":[${entries[*]}]}")
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  database-images:
    runs-on: ubuntu-latest
    steps:
      - name: Cache MySQL image
        id: mysql-image
        uses: actions/cache@v6
        with:
          path: /tmp/mysql-image.tar
          key: database-image-mysql-community-server-26.7.1
      - name: Pull and save MySQL image
        if: steps.mysql-image.outputs.cache-hit != 'true'
        run: |
          docker pull container-registry.oracle.com/mysql/community-server:26.7.1
          docker save --output /tmp/mysql-image.tar container-registry.oracle.com/mysql/community-server:26.7.1
      - name: Cache Oracle image
        id: oracle-image
        uses: actions/cache@v6
        with:
          path: /tmp/oracle-image.tar
          key: database-image-oracle-free-slim-faststart
      - name: Pull and save Oracle image
        if: steps.oracle-image.outputs.cache-hit != 'true'
        run: |
          docker pull gvenzl/oracle-free:slim-faststart
          docker save --output /tmp/oracle-image.tar gvenzl/oracle-free:slim-faststart
  test:
    needs: [discover, database-images]
    name: ${{ matrix.example }} (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.example }}/${{ matrix.language }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore cached MySQL image
        if: matrix.example == 'data-jdbc-mysql'
        uses: actions/cache/restore@v6
        with:
          path: /tmp/mysql-image.tar
          key: database-image-mysql-community-server-26.7.1
      - name: Load MySQL image
        if: matrix.example == 'data-jdbc-mysql'
        run: docker load --input /tmp/mysql-image.tar
      - name: Restore cached Oracle image
        if: matrix.example == 'data-jdbc-oracle'
        uses: actions/cache/restore@v6
        with:
          path: /tmp/oracle-image.tar
          key: database-image-oracle-free-slim-faststart
      - name: Load Oracle image
        if: matrix.example == 'data-jdbc-oracle'
        run: docker load --input /tmp/oracle-image.tar
      - name: Read Pyronaut version
        id: pyronaut
        working-directory: .
        # .pyronaut-version pins the release every example runs against; the
        # update-pyronaut-version workflow bumps it when Pyronaut releases.
        run: echo "version=$(tr -d '[:space:]' < .pyronaut-version)" >> "$GITHUB_OUTPUT"
      - uses: micronaut-projects/setup-pyronaut@v1
        with:
          pyronaut-version: ${{ steps.pyronaut.outputs.version }}
          project-dir: ${{ matrix.example }}/${{ matrix.language }}
          cache-key-suffix: ${{ matrix.example }}-${{ matrix.language }}
      - name: Test (Java)
        if: matrix.language == 'java'
        run: pyronaut test Main.java -- MainTest.java
      - name: Test (Python)
        if: matrix.language == 'python'
        run: pyronaut test main.py -- test_main.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.example }}-${{ matrix.language }}
          path: ${{ matrix.example }}/${{ matrix.language }}/__pyronaut__/reports/tests
          if-no-files-found: ignore
